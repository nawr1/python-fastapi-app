name: Env, Inputs and Outputs Lab
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible"
        required: true
        type: choice
        options: [dev, staging, prod]
      version:
        description: "Version à déployer"
        default: "1.0.0"
      debug:
        description: "Activer le mode debug"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      full_version: ${{ steps.version.outputs.full_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set-environment-variables
        run: |
          echo "APP_NAME=my-app" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +%F)" >> $GITHUB_ENV

      - name: Print-environment-variables
        run: echo "Application $APP_NAME built on $BUILD_DATE"

      - name: Print deployment inputs
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Version: ${{ inputs.version }}"

      - name: Print debug information
        if: ${{ inputs.debug }}
        run: |
          echo "DEBUG activé"
          echo "Runner OS: $RUNNER_OS"
          echo "Actor: $GITHUB_ACTOR"

      - name: Compute full version
        id: version
        run: echo "full_version=${{ inputs.version }}-$(date +%F)" > $GITHUB_OUTPUT
          echo "autre=xyz" > $GITHUB_OUTPUT

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Show deployment target
        run: |
          echo "Version complète : ${{ needs.build.outputs.full_version }}"
          echo "Environnement : ${{ inputs.environment }}"

  verify-env:
    runs-on: ubuntu-latest
    steps:
      - name: Print APP_NAME
        run: echo "APP_NAME vaut [$APP_NAME]"